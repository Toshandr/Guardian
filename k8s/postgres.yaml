apiVersion: v1
kind: PersistentVolumeClaim
metadata: #это я подсмотрел хз как делать правильно в DevOps я ещё так не углублялся
  name: guardian-postgres-data
  namespace: guardian
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: guardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: guardian
            - name: POSTGRES_USER
              value: guardian
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardian-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U guardian -d guardian"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U guardian -d guardian"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: guardian-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: guardian
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
