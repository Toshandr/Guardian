# Для локальной разработки. Перед реальным развертыванием замените пароль.
apiVersion: v1
kind: Secret
metadata:
  name: guardian-secrets
  namespace: guardian
type: Opaque
stringData:
  postgres-password: guardian_local_password
  postgres-connection: Host=postgres;Port=5432;Database=guardian;Username=guardian;Password=guardian_local_password
